<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>💰 Expense Tracker</h1>

    <div class="balance-box">
      <h4>Total Balance</h4>
      <h2 id="balance">₹0</h2>
    </div>

    <div class="summary">
      <div class="summary-box income-box">
        <h4>Income</h4>
        <p id="income">₹0</p>
      </div>
      <div class="summary-box expense-box">
        <h4>Expenses</h4>
        <p id="expense">₹0</p>
      </div>
    </div>

    <h3>Add New Transaction</h3>
    <form id="transaction-form">
      <input type="text" id="text" placeholder="Description (e.g. Groceries)" required />
      <input type="number" id="amount" placeholder="Amount (use - for expense, + for income)" required />
      <select id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Salary">Salary</option>
        <option value="Other">Other</option>
      </select>
      <button type="submit">Add Transaction</button>
    </form>

    <h3>History</h3>
    <ul id="transaction-list"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
